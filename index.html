<script>
(async () => {
  const head = document.querySelector("#m h1"), sub = document.getElementById("s");
  const stop = (t, s) => { head.textContent = t; sub.textContent = s; };
  const STORE = "lr-lr-report-key";

  const unb64 = (s) => {
    s = s.replace(/-/g, "+").replace(/_/g, "/");
    while (s.length % 4) s += "=";
    const bin = atob(s), a = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
    return a;
  };

  let k = null;
  const m = location.hash.match(/[#&]k=([A-Za-z0-9_-]{16,})/);
  if (m) { k = m[1]; try { localStorage.setItem(STORE, k); } catch (e) {} }
  else { try { k = localStorage.getItem(STORE); } catch (e) {} }

  if (!k) {
    stop("This page is encrypted",
         "Open the whole link you were given — the part after the # carries the key.");
    return;
  }
  if (!(window.crypto && crypto.subtle)) {
    stop("Browser not supported", "This page needs a browser with WebCrypto over https.");
    return;
  }
  try {
    const buf = unb64(document.getElementById("p").textContent.trim());
    // layout: 8-byte magic | 16-byte salt | 12-byte iv | ciphertext+tag
    if (new TextDecoder().decode(buf.slice(0, 8)) !== "LRSEAL1\u0000") throw new Error("bad header");
    const salt = buf.slice(8, 24), iv = buf.slice(24, 36), ct = buf.slice(36);
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(k), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: salt, iterations: 200000, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const pt = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: iv, additionalData: buf.slice(0, 8) }, key, ct);
    const html = new TextDecoder("utf-8").decode(pt);
    document.open(); document.write(html); document.close();
  } catch (e) {
    stop("Could not decrypt",
         "The key in this link does not match this page, or the link arrived truncated.");
  }
})();
</script>
